<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIR'S END — An Interactive Survival Story</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="intro.css">
</head>
<body>

<!-- Title screen overlay — shown on launch, before gameplay -->
<div id="title-screen">
  <div id="title-screen-content">
    <h1 id="title-logo">MIR'S END</h1>
    <div id="title-subtitle">An Interactive Survival Story</div>
    <nav id="title-menu">
      <button class="menu-btn" id="menu-new-game">New Game</button>
      <button class="menu-btn" id="menu-continue" disabled>Continue</button>
      <button class="menu-btn" id="menu-settings" disabled>Settings</button>
    </nav>
    <div id="title-footer">Press ESC during gameplay to return to this menu</div>
  </div>
</div>

<div id="game-shell">

  <!-- Menu button — visible during gameplay -->
  <button id="ingame-menu-btn" title="Menu (ESC)">☰ MENU</button>

  <!-- Left panel: scrollable story text output -->
  <div id="story-panel">
    <div id="story-output"></div>
  </div>

  <!-- Right sidebar -->
  <div id="sidebar">

    <!-- Top right: scene illustration -->
    <div id="scene-panel">
      <pre id="scene-art">[No signal]</pre>
    </div>

    <!-- Mid right: title display -->
    <div id="title-panel">
      <h1>MIR'S END</h1>
      <div class="subtitle">An Interactive Survival Story</div>
      <div id="save-load-buttons">
        <button id="btn-save" class="sl-btn" title="Save game">Save</button>
        <button id="btn-load" class="sl-btn" title="Load game">Load</button>
        <button id="btn-continue" class="sl-btn" title="Continue from last save">Continue</button>
      </div>
    </div>

    <!-- Bottom right: status panel -->
    <div id="status-panel">
      <h2>Station Status</h2>

      <div class="status-row">
        <span class="status-label">O2 Level</span>
        <span id="status-o2" class="status-value good">100%</span>
      </div>
      <div id="status-bar-o2">
        <div class="bar-fill" style="width: 100%; background: var(--status-green);"></div>
      </div>

      <div class="status-row" style="margin-top: 0.5em;">
        <span class="status-label">Morale</span>
        <span id="status-morale" class="status-value good">70%</span>
      </div>
      <div id="status-bar-morale">
        <div class="bar-fill" style="width: 70%; background: var(--status-green);"></div>
      </div>

      <div id="inventory-section">
        <h2>Inventory</h2>
        <ul id="inventory-list">
          <li class="empty-inventory">Nothing carried</li>
        </ul>
      </div>
    </div>

  </div>

  <!-- Bottom: command input -->
  <div id="input-bar">
    <span id="input-prompt">&gt;</span>
    <input
      type="text"
      id="command-input"
      placeholder="Enter command..."
      autocomplete="off"
      spellcheck="false"
    >
  </div>

</div>

<!-- Offscreen gameport for Quixe/GlkOte attachment.
     GlkOte measures DOM metrics during init, so display:none breaks it.
     We keep it in the layout but move it out of view; ui.js intercepts
     GlkOte.update() and routes text to the visible story panel. -->
<div id="gameport" style="position: absolute; left: -10000px; width: 800px; height: 600px; overflow: hidden;">
  <noscript>
    <p style="color: #7ec8e3; padding: 2em;">
      MIR'S END requires JavaScript to play. Please enable JavaScript in your browser.
    </p>
  </noscript>
  <!-- GlkOte needs a #windowport child inside the gameport by convention. -->
  <div id="windowport"></div>
</div>

<!--
  Browser-based Glulx interpreter.

  To play locally:
  1. Build the story: npm run build:story
  2. Download Parchment: https://github.com/curiousdannii/parchment/releases
     OR Quixe: https://eblong.com/zarf/glulx/quixe/
  3. Place interpreter files in game/lib/
  4. Uncomment the script tags below

  For Quixe, include:
    - glkote.min.js, glkote.css
    - quixe.min.js

  For Parchment, include:
    - jquery.min.js
    - parchment.min.js
-->

<script>
  // Configuration for the interpreter
  var defined_game_file = "dist/story.ulx";

  // Parchment auto-configuration
  var parchment_options = {
    default_story: ["dist/story.ulx"],
    lib_path: "lib/",
    proxy_url: ""
  };
</script>

<!-- Quixe interpreter bundle -->
<link rel="stylesheet" href="lib/glkote.css">
<link rel="stylesheet" href="lib/dialog.css">
<script src="lib/jquery-1.12.4.min.js"></script>
<script src="lib/glkote.min.js"></script>
<script src="lib/quixe.min.js"></script>

<!-- Boot Quixe after New Game is pressed. ui.js calls MirsEndBoot.start(). -->
<script>
  window.MirsEndBoot = {
    started: false,
    start: function () {
      if (this.started) return;
      if (typeof GiLoad === "undefined" || !GiLoad.load_run) {
        console.error("[MirsEndBoot] GiLoad is not loaded. Check script order.");
        return;
      }
      this.started = true;
      /* Fetch the .ulx ourselves and hand GiLoad an array of bytes.
         GiLoad's string-URL auto-detect misreads short paths. */
      fetch(defined_game_file)
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status} loading ${defined_game_file}`);
          return r.arrayBuffer();
        })
        .then((buf) => {
          var bytes = Array.from(new Uint8Array(buf));
          GiLoad.load_run(null, bytes, "array");
          console.log("[MirsEndBoot] Quixe started —", bytes.length, "bytes");
        })
        .catch((err) => {
          this.started = false;
          console.error("[MirsEndBoot] fetch/load failed:", err);
        });
    },
  };
</script>

<!-- Intro sequence — must load before UI shell -->
<script src="intro.js"></script>

<!-- Save/Load Manager — must load before UI shell -->
<script src="save-manager.js"></script>

<!-- UI Shell — must load after interpreter scripts -->
<script src="ui.js"></script>

</body>
</html>
