# MIR'S END — Feature Registry
#
# Every user-visible feature we promise to support is listed here.
# Each entry MUST have a corresponding e2e test file at
# `tests/e2e/<id>.spec.ts`. The meta test at `tests/e2e/_catalog.spec.ts`
# enforces that mapping.
#
# Adding a feature:
#   1. Append a new entry below.
#   2. Create `tests/e2e/<id>.spec.ts` with at least one test.
#   3. Run `npx playwright test` — the catalog test will verify the link.
#
# Fields:
#   id            — kebab-case, matches spec filename
#   area          — grouping (menu, save-load, intro, gameplay, ui, story)
#   demonstrates  — one-line description of what this proves
#   surfaces      — which observation surfaces the feature touches
#                   (dom | state | storage | interpreter)

- id: menu-new-game
  area: menu
  demonstrates: >
    Clicking "New Game" transitions past the title screen, skips the
    intro on Escape, boots the Inform 7 story, and renders the opening
    narrative into the story panel.
  surfaces: [dom, state, interpreter]

- id: save-roundtrip
  area: save-load
  demonstrates: >
    A save written via the UI persists to localStorage under a known
    key, and reading that key back yields a payload that (when applied)
    restores the game state. Covers the DOM → storage → DOM loop.
  surfaces: [dom, storage, state]

- id: command-moves-room
  area: gameplay
  demonstrates: >
    Typing a movement command (e.g. NORTH) into the input drives the
    interpreter, which updates currentRoom in window.MirsEnd.getState()
    and emits new room text into the story panel.
  surfaces: [dom, state, interpreter]

- id: ui-status-mirrors-game
  area: ui
  demonstrates: >
    The Inform 7 every-turn rule emits a machine-readable status line
    that ui.js parses and applies to window.MirsEnd state. After taking
    items and advancing turns, the sidebar reflects the real oxygen-level,
    morale-level, and inventory — and the magic status line is never
    visible in the story panel.
  surfaces: [dom, state, interpreter]

- id: user-input-reaches-interpreter
  area: ui
  demonstrates: >
    Typing a command into the visible #command-input (the bar the real
    player uses) reaches the Inform 7 interpreter and produces a
    response. Guards against regressions where the input-forwarding
    logic (ui.js sendToInterpreter) silently stops driving GlkOte.
  surfaces: [dom, interpreter]

- id: ai-feature-flag
  area: gameplay
  demonstrates: >
    The warm AI feature flag (MIRSEND_AI_ENABLED) is off by default.
    TALK TO ARGON prints a canned in-fiction line when disabled, shows
    an AI-online badge and first-run onboarding modal when enabled,
    and falls back to the canned line when the proxy is unreachable.
  surfaces: [dom, state, storage]

- id: act2-gate
  area: story
  demonstrates: >
    Climax actions (TRANSMIT, DEORBIT, FIRE CANNON) are soft-blocked
    until the player completes at least 3 beats in either the B1
    (engineer) or B2 (witness) Act 2 path. A full B1 run allows
    TRANSMIT to fire normally.
  surfaces: [dom, interpreter]

- id: c2-descent
  area: story
  demonstrates: >
    The DEORBIT action in the Soyuz Ferry triggers the C2 climax,
    fires a six-beat D3 reentry sequence on a turn counter, and
    transitions to the terminal E3 return ending. The oxygen timer
    does not fire during descent.
  surfaces: [dom, state, interpreter]

- id: session-export
  area: ui
  demonstrates: >
    Every playthrough is recorded to localStorage as the player types
    commands. The recording includes the full transcript, command
    history, and final state. Clicking Export (or Ctrl/Cmd+E) downloads
    the session as JSON, which can be shared for post-playtest review.
  surfaces: [dom, storage, state]

- id: session-post
  area: ui
  demonstrates: >
    Completed sessions are POSTed to the local ingest endpoint
    (/v1/sessions) on game end and manual export. Failures are
    swallowed gracefully. Player kind is detected from init scripts,
    query params, or defaults to human.
  surfaces: [dom, state]

- id: title-screen-restyle
  area: menu
  demonstrates: >
    The title screen renders the v3 Soviet terminal visual language: a
    bezel + phosphor CRT frame around an etched ID plate that names
    "MIR'S END" in Latin, bilingual menu buttons (NEW GAME / НОВАЯ ИГРА),
    and phosphor scanlines + vignette matching the in-game sidebar
    panels. Guards against regressions in the visible structural
    elements that establish the design language before gameplay starts.
  surfaces: [dom]
